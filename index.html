<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Mission briefings</title>
<style>
:root { --bg:#f4f2ec; --ink:#14171c; --mute:#5b6270; --line:#d9d4c7; --acc:#1d4f91; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171c; --ink:#ecebe6; --mute:#9aa2ae; --line:#2b313b; --acc:#7fb0ff; } }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
main { max-width:860px; margin:0 auto; padding:32px 16px; }
h1 { font-size:28px; margin:0 0 4px; } p { color:var(--mute); margin:0 0 24px; }
ul { list-style:none; padding:0; margin:0; } li { border-top:1px solid var(--line); padding:14px 0; display:grid; gap:2px; }
a { color:var(--acc); text-decoration:none; } a:hover { text-decoration:underline; }
span, small { color:var(--mute); }
</style></head><body><main><h1>Mission briefings</h1>
<p>Read the briefing before the mission. Each mission has the full briefing pack and a PDF.</p>
